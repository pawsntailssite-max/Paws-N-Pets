<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Gateway | PAWS-N-TAILS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen text-slate-200">
    <div class="max-w-md w-full p-8 bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl">
        <div class="text-center mb-8">
            <div class="text-blue-500 mb-2"><i class="fa-solid fa-shield-halved text-5xl"></i></div>
            <h1 class="text-2xl font-black uppercase tracking-tighter italic">Master Control Access</h1>
            <p class="text-slate-500 text-sm">Click below to send a secure link to the registered admin email.</p>
        </div>
        
        <div class="space-y-4">
            <!-- Email input removed for security. Email is hardcoded in script. -->
            <button onclick="requestMagicLink()" id="reqBtn"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all active:scale-95 shadow-lg shadow-blue-900/20">
                SEND MAGIC LINK
            </button>
        </div>
        
        <p id="msg" class="mt-6 text-xs text-center font-medium"></p>
    </div>

    <script>
        const SB_URL = 'https://vxzixltgnuvximbbttxx.supabase.co';
        const SB_KEY = 'sb_publishable_TyLXdjnySjpRxUS-vBk3MQ_mAq1UELd';
        const authClient = supabase.createClient(SB_URL, SB_KEY);

        // SURGICAL UPDATE: Hardcoded Admin Email
        const ADMIN_EMAIL = 'pawsntailssite@gmail.com'; 

        async function requestMagicLink() {
            const btn = document.getElementById('reqBtn');
            const msg = document.getElementById('msg');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>SENDING...';

            const { error } = await authClient.auth.signInWithOtp({
                email: ADMIN_EMAIL,
                options: {
                    emailRedirectTo: window.location.origin + '/master-control.html'
                }
            });

            if (error) {
                msg.className = "mt-6 text-xs text-center text-rose-500";
                msg.innerText = "Error: " + error.message;
                btn.disabled = false;
                btn.innerText = "SEND MAGIC LINK";
            } else {
                msg.className = "mt-6 text-xs text-center text-emerald-500";
                msg.innerText = "Success! The link has been sent to the admin inbox.";
                btn.innerText = "LINK SENT";
            }
        }
    </script>
</body>
</html>

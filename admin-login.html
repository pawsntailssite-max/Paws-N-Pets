<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Gateway | PAWS-N-TAILS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen text-slate-200">
    <div class="max-w-md w-full p-8 bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl">
        <h1 class="text-2xl font-black mb-2 uppercase tracking-tighter italic">Master Control Access</h1>
        <p class="text-slate-500 text-sm mb-6">Enter your email to receive a secure login link.</p>
        
        <input type="email" id="adminEmail" placeholder="admin@pawsntails.com" 
               class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl mb-4 outline-none focus:border-blue-500 transition-all">
        
        <button onclick="requestMagicLink()" id="reqBtn"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-all active:scale-95">
            SEND MAGIC LINK
        </button>
        <p id="msg" class="mt-4 text-xs text-center"></p>
    </div>

    <script>
        const SB_URL = 'https://vxzixltgnuvximbbttxx.supabase.co';
        const SB_KEY = 'sb_publishable_TyLXdjnySjpRxUS-vBk3MQ_mAq1UELd';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        async function requestMagicLink() {
            const email = document.getElementById('adminEmail').value;
            const btn = document.getElementById('reqBtn');
            const msg = document.getElementById('msg');

            btn.disabled = true;
            btn.innerText = "SENDING...";

            const { error } = await supabaseClient.auth.signInWithOtp({
                email: email,
                options: {
                    // This is where you want to go after clicking the link
                    emailRedirectTo: window.location.origin + '/master-control.html'
                }
            });

            if (error) {
                msg.className = "mt-4 text-xs text-center text-rose-500";
                msg.innerText = error.message;
                btn.disabled = false;
                btn.innerText = "SEND MAGIC LINK";
            } else {
                msg.className = "mt-4 text-xs text-center text-emerald-500";
                msg.innerText = "Check your inbox! The link is on its way.";
            }
        }
    </script>
</body>
</html>

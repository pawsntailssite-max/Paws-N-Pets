<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Gateway | PAWS-N-TAILS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen text-slate-200">
    <div class="max-w-md w-full p-8 bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl">
        <div class="text-center mb-8">
            <div class="text-blue-500 mb-2"><i class="fa-solid fa-shield-halved text-5xl"></i></div>
            <h1 class="text-2xl font-black uppercase tracking-tighter italic">Master Control Access</h1>
            <p class="text-slate-500 text-sm">Enter your email to receive a secure login link.</p>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Admin Email</label>
                <input type="email" id="adminEmail" placeholder="admin@pawsntails.com" 
                       class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl outline-none focus:border-blue-500 transition-all text-white">
            </div>
            
            <button onclick="requestMagicLink()" id="reqBtn"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all active:scale-95 shadow-lg shadow-blue-900/20">
                SEND MAGIC LINK
            </button>
        </div>
        
        <p id="msg" class="mt-6 text-xs text-center font-medium"></p>
    </div>

    <script>
        const SB_URL = 'https://vxzixltgnuvximbbttxx.supabase.co';
        const SB_KEY = 'sb_publishable_TyLXdjnySjpRxUS-vBk3MQ_mAq1UELd';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        async function requestMagicLink() {
            const email = document.getElementById('adminEmail').value.trim();
            const btn = document.getElementById('reqBtn');
            const msg = document.getElementById('msg');

            if(!email) { alert("Please enter your email"); return; }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>SENDING...';

            const { error } = await supabaseClient.auth.signInWithOtp({
                email: email,
                options: {
                    // Automatically detects if you are on localhost or your production domain
                    emailRedirectTo: window.location.origin + '/master-control.html'
                }
            });

            if (error) {
                msg.className = "mt-6 text-xs text-center text-rose-500";
                msg.innerText = "Error: " + error.message;
                btn.disabled = false;
                btn.innerText = "SEND MAGIC LINK";
            } else {
                msg.className = "mt-6 text-xs text-center text-emerald-500";
                msg.innerText = "Success! Check your email for the secure link.";
                btn.innerText = "LINK SENT";
            }
        }
    </script>
</body>
</html>

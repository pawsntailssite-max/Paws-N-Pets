<script>
    const SB_URL = 'https://vxzixltgnuvximbbttxx.supabase.co';
    const SB_KEY = 'sb_publishable_TyLXdjnySjpRxUS-vBk3MQ_mAq1UELd';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    const loginForm = document.getElementById('loginForm');
    const authBtn = document.getElementById('authBtn');
    
    // UI ADJUSTMENTS: Changing labels to match SaaS model
    document.querySelector('label[for="email"]').innerText = "Unique User ID";
    document.getElementById('email').type = "text";
    document.getElementById('email').placeholder = "e.g. happypaws01";
    document.querySelector('label[for="password"]').innerText = "License Key";
    document.getElementById('password').placeholder = "PK-XXXXXX";

    loginForm.onsubmit = async (e) => {
        e.preventDefault();
        authBtn.disabled = true;
        authBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> VERIFYING...`;

        const userId = document.getElementById('email').value.trim().toLowerCase();
        const licenseKey = document.getElementById('password').value.trim();

        try {
            // 1. Check the master_control table
            const { data, error } = await supabaseClient
                .from('master_control')
                .select('*')
                .eq('user_id', userId)
                .eq('api_key', licenseKey)
                .single();

            if (error || !data) {
                throw new Error("Invalid User ID or License Key.");
            }

            // 2. Check if the status is Active
            if (data.reg_status !== 'Active') {
                throw new Error("This account is " + data.reg_status + ". Please contact support.");
            }

            // 3. Check Expiry Date
            const today = new Date();
            const expiry = new Date(data.expiry_date);
            if (today > expiry) {
                throw new Error("Your license expired on " + data.expiry_date);
            }

            // 4. SUCCESS: Store session info locally
            localStorage.setItem('paws_session', JSON.stringify({
                clientName: data.client_name,
                userId: data.user_id,
                schema: data.db_schema,
                expiry: data.expiry_date
            }));

            // Redirect to navigation/dashboard
            window.location.href = "navigation.html";

        } catch (err) {
            alert(err.message);
        } finally {
            authBtn.disabled = false;
            authBtn.innerText = "SIGN IN";
        }
    };
</script>

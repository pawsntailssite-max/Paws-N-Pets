<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PAWS-N-TAILS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center px-4">

    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
        <div class="text-center mb-8">
            <div class="text-blue-600 mb-2"><i class="fa-solid fa-paw text-5xl"></i></div>
            <h2 class="text-2xl font-bold text-slate-800 uppercase tracking-tight">Paws-N-Tails</h2>
            <p class="text-slate-500 font-medium">Member Access</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Unique User ID</label>
                <input type="text" id="userId" placeholder="e.g. happypaws01" required 
                       class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">License Key</label>
                <input type="password" id="licenseKey" placeholder="PK-XXXX-XXXX" required 
                       class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>

            <button type="submit" id="authBtn" 
                    class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 shadow-lg transition-all active:scale-95">
                SIGN IN
            </button>
        </form>

        <div class="mt-6 text-center border-t border-slate-100 pt-6">
            <a href="apply.html" class="text-sm text-slate-400 hover:text-blue-600 font-medium transition-colors">
                Need a license? Apply here
            </a>
        </div>
    </div>

    <script>
        // 1. CONFIGURATION
        const SB_URL = 'https://vxzixltgnuvximbbttxx.supabase.co';
        const SB_KEY = 'sb_publishable_TyLXdjnySjpRxUS-vBk3MQ_mAq1UELd'; 

        // 2. INITIALIZATION (With Fail-safe)
        let supabaseClient;
        try {
            supabaseClient = window.supabase.createClient(SB_URL, SB_KEY);
            console.log("Login initialized successfully.");
        } catch (e) {
            console.error("Supabase load error:", e);
        }

        const loginForm = document.getElementById('loginForm');
        const authBtn = document.getElementById('authBtn');

        // 3. LOGIN LOGIC
        loginForm.onsubmit = async (e) => {
            e.preventDefault();
            
            authBtn.disabled = true;
            authBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> VERIFYING...';

            const user_id_input = document.getElementById('userId').value.trim();
            const license_key_input = document.getElementById('licenseKey').value.trim();

            try {
                // Query master_control for the match
                const { data, error } = await supabaseClient
                    .from('master_control')
                    .select('*')
                    .eq('user_id', user_id_input)
                    .eq('api_key', license_key_input)
                    .single();

                if (error || !data) {
                    throw new Error("Invalid Credentials. Check your User ID and Key.");
                }

                if (data.reg_status !== 'Active') {
                    throw new Error(`Access Denied: Account is ${data.reg_status}.`);
                }

                // Check Expiry
                if (data.expiry_date && new Date() > new Date(data.expiry_date)) {
                    throw new Error("Access Expired. Please contact support.");
                }

                // Save Session
                localStorage.setItem('paws_session', JSON.stringify({
                    clinicName: data.client_name,
                    userId: data.user_id,
                    schema: data.db_schema,
                    license: data.api_key
                }));

                // Go to Dashboard
                window.location.href = "navigation.html";

            } catch (err) {
                alert(err.message);
                authBtn.disabled = false;
                authBtn.innerText = "SIGN IN";
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Access | PAWS-N-TAILS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 py-12 px-4">

    <div class="max-w-xl mx-auto bg-white p-10 rounded-3xl shadow-xl border border-slate-100">
        
        <div class="text-center mb-10">
            <div class="bg-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-200">
                <i class="fa-solid fa-paw text-white text-3xl"></i>
            </div>
            <h2 class="text-3xl font-black text-slate-900 tracking-tight">GET STARTED</h2>
            <p class="text-slate-500 font-medium mt-1">Request your Veterinarian Portal access</p>
        </div>

        <form id="applyForm" class="space-y-5">
            
            <!-- Client Name -->
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Clinic / Business Name</label>
                <div class="relative mt-1">
                    <i class="fa-solid fa-hospital absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="clientName" required placeholder="e.g. Happy Paws Clinic" 
                           class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
            </div>

            <!-- User ID (The Handle) -->
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Unique User ID (No Spaces)</label>
                <div class="relative mt-1">
                    <i class="fa-solid fa-at absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="userId" required placeholder="e.g. happypaws01" 
                           pattern="^[a-zA-Z0-9_]+$" title="Only letters, numbers, and underscores allowed"
                           class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
                <p class="text-[10px] text-slate-400 mt-2 px-1">This will be used to identify your private database.</p>
            </div>

            <!-- Email Address -->
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Work Email Address</label>
                <div class="relative mt-1">
                    <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="email" id="email" required placeholder="doctor@clinic.com" 
                           class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
            </div>

            <div class="pt-6">
                <button type="submit" id="submitBtn" 
                        class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl hover:bg-black transition-all active:scale-95 flex items-center justify-center gap-3 shadow-xl shadow-slate-200 uppercase tracking-widest text-sm">
                    Submit Request <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
                
                <button type="button" onclick="window.location.href='index.html'" 
                        class="w-full mt-3 text-slate-400 font-bold py-2 text-xs hover:text-slate-600 transition-all">
                    RETURN TO HOME
                </button>
            </div>
        </form>
    </div>

    <script>
        // Supabase Init
        const SB_URL = 'https://vxzixltgnuvximbbttxx.supabase.co';
        const SB_KEY = 'sb_publishable_TyLXdjnySjpRxUS-vBk3MQ_mAq1UELd';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        const form = document.getElementById('applyForm');
        const btn = document.getElementById('submitBtn');

        form.onsubmit = async (e) => {
            e.preventDefault();
            
            // UI Loading State
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> SENDING...`;

            const payload = {
                client_name: document.getElementById('clientName').value,
                user_id: document.getElementById('userId').value.toLowerCase().trim(),
                email: document.getElementById('email').value.toLowerCase().trim(),
                reg_status: 'Pending'
            };

            try {
                const { error } = await supabaseClient
                    .from('master_control') // Pointing to your new command table
                    .insert([payload]);

                if (error) {
                    if(error.code === '23505') throw new Error("This User ID or Email is already registered.");
                    throw error;
                }

                alert("Success! Your request has been sent. We will review and provide your License Key shortly.");
                window.location.replace("index.html");

            } catch (err) {
                alert("Request Failed: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `Submit Request <i class="fa-solid fa-arrow-right text-xs"></i>`;
            }
        };
    </script>
</body>
</html>

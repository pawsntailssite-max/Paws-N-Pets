<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | PAWS-N-TAILS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 py-10 px-4">

    <div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-lg border border-slate-100">
        
        <!-- Header area with Logo -->
        <div class="text-center mb-8 flex flex-col items-center">
            <img src="./Logo.jpg" alt="Paws-N-Tails Logo" class="w-24 h-24 object-contain mb-3" onerror="this.src='https://via.placeholder.com/100?text=Logo'">
            <h2 class="text-2xl font-bold text-slate-800 uppercase tracking-tight">Paws-N-Tails</h2>
            <p class="text-slate-500">Veterinarian Registration Portal</p>
        </div>

        <form id="applyForm" class="space-y-6">
            
            <!-- Profile Picture (Unnumbered) -->
            <div class="flex items-center gap-4 p-4 bg-slate-50 rounded-xl border border-slate-200">
                <div id="preview" class="h-16 w-16 rounded-full bg-slate-200 flex items-center justify-center overflow-hidden border-2 border-white shadow-sm">
                    <i class="fa-solid fa-user text-slate-400 text-xl"></i>
                </div>
                <div class="flex-1">
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Profile Photo (Optional)</label>
                    <input type="file" id="profilePic" accept="image/*" class="text-xs text-slate-500 file:mr-3 file:py-1 file:px-3 file:rounded-full file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
            </div>

            <!-- 1, 2, 3. Title, First & Last Name -->
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                <div class="col-span-1 md:col-span-3">
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">1. Title *</label>
                    <select id="title" required class="w-full p-2.5 border border-slate-200 rounded-lg bg-white outline-none focus:ring-2 focus:ring-blue-500 mt-1">
                        <option value="" disabled selected>Select</option>
                        <option>Dr.</option>
                        <option>Mr.</option>
                        <option>Ms.</option>
                    </select>
                </div>
                <div class="col-span-1 md:col-span-4">
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">2. First Name *</label>
                    <input type="text" id="firstName" required class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 mt-1">
                </div>
                <div class="col-span-1 md:col-span-5">
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">3. Last Name *</label>
                    <input type="text" id="lastName" required class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 mt-1">
                </div>
            </div>

            <!-- 4, 5. Email & Mobile -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">4. Email Address *</label>
                    <input type="email" id="email" required class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 mt-1">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">5. Mobile Number *</label>
                    <input type="tel" id="mobile" required class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 mt-1">
                </div>
            </div>

            <!-- 6, 7. DOB & Clinic Name -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">6. Date of Birth *</label>
                    <input type="date" id="dob" required class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 mt-1">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">7. Clinic/Company Name *</label>
                    <input type="text" id="clinicName" required class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 mt-1">
                </div>
            </div>

            <!-- 8. Clinic Address -->
            <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">8. Clinic Address (Optional)</label>
                <textarea id="address" class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 mt-1" rows="2"></textarea>
            </div>
            
            <!-- 9, 10, 11, 12. Pincode, City, District, State -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">9. Pincode *</label>
                    <input type="text" id="pincode" maxlength="6" required class="w-full p-2.5 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 mt-1" placeholder="6 digits">
                    <p id="pinMsg" class="text-[10px] text-blue-500 mt-1 hidden">Fetching area...</p>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">10. Town/City *</label>
                    <input type="text" id="city" required class="w-full p-2.5 border border-slate-200 bg-slate-50 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 mt-1">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">11. District *</label>
                    <input type="text" id="district" required class="w-full p-2.5 border border-slate-200 bg-slate-50 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 mt-1">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">12. State *</label>
                    <input type="text" id="state" required class="w-full p-2.5 border border-slate-200 bg-slate-50 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 mt-1">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col md:flex-row gap-4 pt-4 border-t border-slate-100">
                <button type="button" onclick="window.location.href='index.html'" class="w-full md:w-1/3 bg-slate-200 text-slate-700 font-bold py-4 rounded-xl hover:bg-slate-300 transition-all text-center">
                    CANCEL / DISCARD
                </button>
                <button type="submit" id="submitBtn" class="w-full md:w-2/3 bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> SUBMIT APPLICATION
                </button>
            </div>
        </form>
    </div>

    <script>
        const SB_URL = 'https://vxzixltgnuvximbbttxx.supabase.co';
        const SB_KEY = 'sb_publishable_TyLXdjnySjpRxUS-vBk3MQ_mAq1UELd';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
        
        const form = document.getElementById('applyForm');
        const fileInput = document.getElementById('profilePic');
        const preview = document.getElementById('preview');
        const pincodeInput = document.getElementById('pincode');

        // Image Preview Converter
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (f) => preview.innerHTML = `<img src="${f.target.result}" class="w-full h-full object-cover">`;
                reader.readAsDataURL(file);
            }
        };

        // Pincode API Fetcher
        pincodeInput.addEventListener('input', async function(e) {
            const pin = e.target.value.trim();
            const msg = document.getElementById('pinMsg');
            
            if (pin.length === 6 && !isNaN(pin)) {
                msg.classList.remove('hidden');
                msg.innerText = "Fetching area details...";
                try {
                    const response = await fetch(`https://api.postalpincode.in/pincode/${pin}`);
                    const data = await response.json();
                    
                    if (data[0].Status === 'Success') {
                        const area = data[0].PostOffice[0];
                        document.getElementById('city').value = area.Block || area.Name; // Tehsil/Taluk
                        document.getElementById('district').value = area.District;
                        document.getElementById('state').value = area.State;
                        msg.innerText = "Area found!";
                        msg.classList.replace('text-blue-500', 'text-green-500');
                    } else {
                        msg.innerText = "Invalid Pincode.";
                        msg.classList.replace('text-blue-500', 'text-red-500');
                    }
                } catch (error) {
                    msg.innerText = "Network error. Please type manually.";
                    msg.classList.replace('text-blue-500', 'text-red-500');
                }
            } else {
                msg.classList.add('hidden');
                msg.classList.replace('text-red-500', 'text-blue-500');
                msg.classList.replace('text-green-500', 'text-blue-500');
            }
        });

        // Form Submission
        form.onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> PROCESSING...`;

            try {
                let photoUrl = null;
                const file = fileInput.files[0];

                if (file) {
                    const fileName = `profile_${Date.now()}_${file.name.replace(/\s/g, '_')}`;
                    const { error: upError } = await supabaseClient.storage
                        .from('profiles')
                        .upload(`public/${fileName}`, file);

                    if (upError) throw new Error("Photo Upload Failed: " + upError.message);

                    const { data: { publicUrl } } = supabaseClient.storage
                        .from('profiles').getPublicUrl(`public/${fileName}`);
                    photoUrl = publicUrl;
                }

                // Database Insert with System Defaults
                const { error: dbError } = await supabaseClient.from('applications').insert([{
                    profile_url: photoUrl,
                    title: document.getElementById('title').value,
                    first_name: document.getElementById('firstName').value,
                    last_name: document.getElementById('lastName').value,
                    email: document.getElementById('email').value,
                    mobile_number: document.getElementById('mobile').value,
                    dob: document.getElementById('dob').value,
                    clinic_name: document.getElementById('clinicName').value,
                    address: document.getElementById('address').value,
                    pincode: document.getElementById('pincode').value,
                    city: document.getElementById('city').value,
                    district: document.getElementById('district').value,
                    state: document.getElementById('state').value,
                    
                    // Fields populated automatically by the system
                    user_type: 'member',
                    status: 'Pending',
                    is_active: false,
                    amt_paid: 0,
                    ver_type: 'Free'
                }]);

                if (dbError) throw dbError;

                alert("Application Submitted Successfully!");
                window.location.replace("index.html");

            } catch (err) {
                alert("Error: " + err.message);
                console.error("Submission Error:", err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> SUBMIT APPLICATION`;
            }
        };
    </script>
</body>
</html>
